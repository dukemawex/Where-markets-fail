name: Deploy API
on:
  push:
    branches: [main]
    paths: ['api/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with: { token: ${{ secrets.DIGITAL_OCEAN_TOKEN }} }
      - run: doctl apps create-deployment ${{ secrets.DO_APP_ID }}
