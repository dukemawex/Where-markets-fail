name: Data Ingestion Pipeline
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Ingest questions
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
        run: python pipeline/ingest.py
      - name: Compute calibration
        env: { MONGODB_URI: ${{ secrets.MONGODB_URI }} }
        run: python pipeline/calibrate.py
      - name: Score red flags
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipeline/redflag.py
      - name: Match analogs
        env: { MONGODB_URI: ${{ secrets.MONGODB_URI }} }
        run: python pipeline/analogs.py
